<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0aa;
    --accent:#5b8cff; --accent2:#33d6a6; --border:#2a2e38;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.8;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  nav{border-bottom:1px solid var(--border)}
  nav .wrap{display:flex;gap:20px;align-items:center;height:60px;flex-wrap:wrap}
  nav .logo{font-weight:700;margin-right:auto}
  nav a{color:var(--muted);font-size:14px}
  .langs{display:flex;gap:8px;flex-wrap:wrap}
  .langs a{font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:10px}
  .langs a.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  main{padding:48px 0}
  .back{display:inline-block;margin-bottom:28px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px}
  h1{font-size:2rem;margin-bottom:16px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .tags span{font-size:12px;color:var(--accent2);background:rgba(51,214,166,.1);
    padding:3px 10px;border-radius:10px}
  .desc{color:var(--text);font-size:16px;margin-bottom:28px}
  .info{background:#14171d;border:1px solid var(--border);border-radius:8px;
    padding:16px 20px;margin-bottom:28px;font-size:14px;color:var(--muted)}
  .info div{margin:4px 0;word-break:break-all}
  .info b{color:var(--text)}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{text-decoration:none;opacity:.9}
  .btn-ghost{border:1px solid var(--border);color:var(--text)}
  footer{border-top:1px solid var(--border);padding:30px 0;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo" id="siteName"></div>
    <a href="index.html" id="backHome"></a>
    <div class="langs" id="langs"></div>
  </div>
</nav>

<main class="wrap">
  <a class="back" id="backProjects" href="index.html#projects"></a>
  <div class="card" id="card"></div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="footerName"></span> <span id="copyright"></span></div>
</footer>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
$("siteName").textContent = S("siteName");
$("footerName").textContent = DATA.heroName;
$("year").textContent = new Date().getFullYear();
$("backHome").textContent = T("backHome");
$("backProjects").textContent = T("backProjects");
$("copyright").textContent = T("copyright");
$("backProjects").href = L("index.html#projects");
$("langs").innerHTML = langSwitcher();

const id = new URLSearchParams(location.search).get("id");
const p = DATA.projects.find(x => x.repo === id);

if (!p) {
  $("card").innerHTML = `<h1>${T("notFoundProject")}</h1><p class="desc">${T("notFoundProjectDesc")}</p>`;
} else {
  document.title = C(p,"title") + " - " + T("sectionProjects");
  $("card").innerHTML = `
    <h1>${C(p,"title")}</h1>
    <div class="tags">${C(p,"tags").map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="desc">${C(p,"desc")}</div>
    <div class="info">
      <div><b>${T("repoLabel")}</b>${p.github}</div>
      ${p.tag
        ? `<div><b>${T("versionLabel")}</b>${p.tag}</div><div><b>${T("fileLabel")}</b>${p.file}</div>`
        : `<div>${T("noRelease")}</div>`}
      <div><b>${T("downloadLabel")}</b>${p.download}</div>
    </div>
    <div class="btn-row">
      <a class="btn btn-primary" href="${p.download}" target="_blank" rel="noopener">${T("download")}</a>
      <a class="btn btn-ghost" href="${p.github}" target="_blank" rel="noopener">${T("githubView")}</a>
    </div>`;
}
</script>
</body>
</html>
