<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project</title>
<link rel="stylesheet" href="site.css" />
</head>
<body data-active="projects">

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="wrap detail-page">
    <a class="back" id="backProjects" href="index.html#projects"></a>
    <div class="card-detail" id="card"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id);
$("backProjects").textContent = T("backProjects");
$("backProjects").href = L("index.html#projects");

const id = new URLSearchParams(location.search).get("id");
const p = DATA.projects.find(x => x.repo === id);

if (!p) {
  $("card").innerHTML = `<h1>${T("notFoundProject")}</h1><p class="desc-detail">${T("notFoundProjectDesc")}</p>`;
} else {
  document.title = C(p,"title") + " - " + T("sectionProjects");
  $("card").innerHTML = `
    <h1>${C(p,"title")}</h1>
    <div class="tags-detail">${C(p,"tags").map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="desc-detail">${C(p,"desc")}</div>
    <div class="info">
      <div><b>${T("repoLabel")}</b>${p.github}</div>
      ${p.tag
        ? `<div><b>${T("versionLabel")}</b>${p.tag}</div><div><b>${T("fileLabel")}</b>${p.file}</div>`
        : `<div>${T("noRelease")}</div>`}
      <div><b>${T("downloadLabel")}</b>${p.download}</div>
    </div>
    <div class="btn-row">
      <a class="btn btn-primary" href="${p.download}" target="_blank" rel="noopener">${T("download")}</a>
      <a class="btn btn-ghost" href="${p.github}" target="_blank" rel="noopener">${T("githubView")}</a>
    </div>`;
}
</script>
</body>
</html>
