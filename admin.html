<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容管理</title>
<link rel="stylesheet" href="site.css" />
<style>
  .admin{max-width:900px;padding:36px 20px 80px}
  .admin h1{font-size:1.8rem;margin-bottom:8px}
  .admin .tip{color:var(--muted);font-size:13px;margin-bottom:24px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button,.langbtn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .tabs button.active,.langbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:12px}
  input,textarea{width:100%;margin-top:5px;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-family:inherit;font-size:14px}
  textarea{min-height:80px;resize:vertical}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1}
  .row button,.panel button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text);cursor:pointer;font-size:13px}
  .row button:hover,.panel button:hover{border-color:var(--accent)}
  .primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
  #status{font-size:13px;margin-left:10px}
  .ok{color:var(--accent2)} .err{color:#ff6b6b}
  #preview{white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;
    background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;
    font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="admin">
  <h1>内容管理</h1>
  <p class="tip">在这里新增/删除/修改项目和文章，保存后直接更新到 GitHub，网站会自动更新。本页不会出现在访客导航里。</p>

  <div class="panel">
    <label>GitHub Token（只需填一次，保存在你自己的浏览器里）
      <input type="password" id="token" placeholder="ghp_... 或 github_pat_..." />
    </label>
    <button class="primary" id="connect">连接 GitHub</button>
    <span id="status"></span>
    <p class="tip" style="margin:12px 0 0">Token 需要 <b>repo / Contents: read and write</b> 权限，且只对这一个仓库授权即可。请不要把 Token 发给别人，也不要写进网站文件。</p>
  </div>

  <div class="tabs">
    <button class="active" data-tab="projects">项目</button>
    <button data-tab="articles">文章</button>
    <button data-tab="basic">基本文字</button>
  </div>

  <div class="panel" id="tab-projects">
    <button class="primary" id="addProject">＋ 新增项目</button>
    <div id="projectList"></div>
  </div>

  <div class="panel" id="tab-articles" style="display:none">
    <button class="primary" id="addArticle">＋ 新增文章</button>
    <div id="articleList"></div>
  </div>

  <div class="panel" id="tab-basic" style="display:none">
    <div class="langbtnbar" id="basicLangs"></div>
    <div id="basicFields" style="margin-top:14px"></div>
  </div>

  <div class="panel" id="editor"></div>

  <div class="panel">
    <button class="primary" id="save">保存到 GitHub</button>
    <button id="download">下载 data.js（备用）</button>
    <pre id="preview"></pre>
  </div>
</div>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const REPO = "alanchan20121201-prog/alanchan20121201-prog.github.io";
const API = "https://api.github.com/repos/" + REPO + "/contents/data.js";
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const zh = (item, field) => (item.i18n && item.i18n["zh-CN"] && item.i18n["zh-CN"][field]) || "";

let token = localStorage.getItem("site-admin-token") || "";
let sha = null;
let editState = null;
let basicLang = "zh-CN";
$("token").value = token;

function status(msg, ok) {
  $("status").textContent = msg;
  $("status").className = ok === false ? "err" : "ok";
}

/* ---------- GitHub 读写 ---------- */
async function connect() {
  token = $("token").value.trim();
  if (!token) { status("请先填写 Token", false); return false; }
  localStorage.setItem("site-admin-token", token);
  const r = await fetch(API, {
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }
  });
  if (!r.ok) { status("连接失败：" + r.status, false); return false; }
  sha = (await r.json()).sha;
  status("已连接，可以编辑");
  return true;
}

function b64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function buildSource() {
  const strip = o => JSON.parse(JSON.stringify(o, (k, v) =>
    ["github", "detail", "download"].includes(k) ? undefined : v));
  return "/* 数据文件 —— 内容由管理页生成，可直接修改 */\n" +
    "const USER = " + JSON.stringify(USER) + ";\n" +
    'const G = "https://github.com/" + USER;\n' +
    'const DL = (repo, tag, file) => G + "/" + repo + "/releases/download/" + tag + "/" + file;\n' +
    'const ZIP = (repo, branch) => G + "/" + repo + "/archive/refs/heads/" + (branch || "main") + ".zip";\n' +
    "const LANGS = " + JSON.stringify(LANGS, null, 2) + ";\n" +
    "const UI = " + JSON.stringify(UI, null, 2) + ";\n" +
    "const SITE = " + JSON.stringify(SITE, null, 2) + ";\n" +
    "const DATA = " + JSON.stringify(strip(DATA), null, 2) + ";\n" +
    "DATA.projects.forEach(p => {\n" +
    '  p.github = G + "/" + p.repo;\n' +
    '  p.detail = "detail.html?id=" + encodeURIComponent(p.repo);\n' +
    "  p.download = p.tag ? DL(p.repo, p.tag, p.file) : ZIP(p.repo);\n" +
    "});\n" +
    "DATA.articles.forEach((a, i) => { a.detail = \"article.html?i=\" + i; });\n";
}

$("connect").onclick = connect;

$("save").onclick = async () => {
  if (!sha && !(await connect())) return;
  const content = buildSource();
  const r = await fetch(API, {
    method: "PUT",
    headers: {
      Authorization: "Bearer " + token,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: "Update site content via admin page",
      content: b64(content), sha: sha, branch: "main"
    })
  });
  if (r.ok) {
    sha = (await r.json()).content.sha;
    status("已保存，约 1 分钟后网站更新");
  } else {
    const j = await r.json().catch(() => ({}));
    status("保存失败：" + (j.message || r.status), false);
  }
};

$("download").onclick = () => {
  const blob = new Blob([buildSource()], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.js";
  a.click();
};

/* ---------- 列表 ---------- */
function renderLists() {
  $("projectList").innerHTML = DATA.projects.map((p, i) =>
    `<div class="row"><span class="grow"><b>${esc(zh(p,"title"))}</b> · ${esc(p.repo)}</span>` +
    `<button onclick="editProject(${i})">编辑</button>` +
    `<button onclick="delProject(${i})">删除</button></div>`).join("");

  $("articleList").innerHTML = DATA.articles.map((a, i) =>
    `<div class="row"><span class="grow"><b>${esc(zh(a,"title"))}</b> · ${esc(a.date)}</span>` +
    `<button onclick="editArticle(${i})">编辑</button>` +
    `<button onclick="delArticle(${i})">删除</button></div>`).join("");

  $("preview").textContent = buildSource();
}

document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    ["projects","articles","basic"].forEach(t =>
      $("tab-" + t).style.display = t === b.dataset.tab ? "block" : "none");
  };
});

/* ---------- 项目编辑 ---------- */
$("addProject").onclick = () => {
  DATA.projects.push({
    repo: "new-project", tag: "v1.0.0", file: "app.exe",
    i18n: Object.fromEntries(LANGS.map(l => [l.code,
      { title: "新项目", desc: "项目介绍", tags: ["工具"] }]))
  });
  editProject(DATA.projects.length - 1);
};

function editProject(i) { editState = { type: "project", index: i, lang: "zh-CN" }; renderEditor(); }
function delProject(i) {
  if (confirm("确定删除这个项目？")) { DATA.projects.splice(i, 1); renderLists(); }
}

/* ---------- 文章编辑 ---------- */
$("addArticle").onclick = () => {
  DATA.articles.push({
    date: new Date().toISOString().slice(0, 10),
    cat: "notes",
    i18n: Object.fromEntries(LANGS.map(l => [l.code,
      { title: "新文章", excerpt: "摘要", content: "正文" }]))
  });
  editArticle(DATA.articles.length - 1);
};

function editArticle(i) { editState = { type: "article", index: i, lang: "zh-CN" }; renderEditor(); }
function delArticle(i) {
  if (confirm("确定删除这篇文章？")) { DATA.articles.splice(i, 1); renderLists(); }
}

/* ---------- 编辑器 ---------- */
function currentItem() {
  return editState.type === "project" ? DATA.projects[editState.index] : DATA.articles[editState.index];
}

function readForm() {
  if (!editState) return;
  const it = currentItem();
  const cur = it.i18n[editState.lang] || (it.i18n[editState.lang] = {});
  const t = $("f_title");
  if (t) cur.title = t.value;
  if (editState.type === "project") {
    const d = $("f_desc"), g = $("f_tags");
    if (d) cur.desc = d.value;
    if (g) cur.tags = g.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if ($("f_repo")) it.repo = $("f_repo").value.trim();
    if ($("f_tag")) it.tag = $("f_tag").value.trim();
    if ($("f_file")) it.file = $("f_file").value.trim();
  } else {
    const e = $("f_excerpt"), c = $("f_content");
    if (e) cur.excerpt = e.value;
    if (c) cur.content = c.value;
    if ($("f_date")) it.date = $("f_date").value.trim();
    if ($("f_cat")) it.cat = $("f_cat").value;
  }
}

function setLang(code) { readForm(); editState.lang = code; renderEditor(); }
function cancelEdit() { editState = null; $("editor").innerHTML = ""; }
function saveEdit() {
  readForm();
  editState = null;
  $("editor").innerHTML = "";
  renderLists();
  status("已修改，记得点「保存到 GitHub」");
}

function renderEditor() {
  if (!editState) { $("editor").innerHTML = ""; return; }
  const it = currentItem();
  const cur = it.i18n[editState.lang] || {};
  const langBtns = LANGS.map(l =>
    `<button class="langbtn ${l.code === editState.lang ? "active" : ""}" onclick="setLang('${l.code}')">${l.label}</button>`
  ).join("");
  const common = editState.type === "project"
    ? `<label>仓库名 repo<input id="f_repo" value="${esc(it.repo)}"></label>
       <label>版本 tag（没有就留空）<input id="f_tag" value="${esc(it.tag || "")}"></label>
       <label>文件名 file（没有就留空）<input id="f_file" value="${esc(it.file || "")}"></label>`
    : `<label>日期<input id="f_date" value="${esc(it.date)}"></label>
       <label>主题<select id="f_cat">
         <option value="notes"${it.cat === "notes" ? " selected" : ""}>随笔 / Notes</option>
         <option value="tutorial"${it.cat === "tutorial" ? " selected" : ""}>教程 / Tutorial</option>
       </select></label>`;
  const fields = editState.type === "project"
    ? `<label>标题<input id="f_title" value="${esc(cur.title || "")}"></label>
       <label>介绍<textarea id="f_desc">${esc(cur.desc || "")}</textarea></label>
       <label>标签（用逗号分隔）<input id="f_tags" value="${esc((cur.tags || []).join(", "))}"></label>`
    : `<label>标题<input id="f_title" value="${esc(cur.title || "")}"></label>
       <label>摘要<textarea id="f_excerpt">${esc(cur.excerpt || "")}</textarea></label>
       <label>正文<textarea id="f_content" rows="8">${esc(cur.content || "")}</textarea></label>`;
  $("editor").innerHTML =
    `<h3>编辑${editState.type === "project" ? "项目" : "文章"}</h3>` +
    `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px">${langBtns}</div>` +
    common + fields +
    `<div class="btn-row" style="display:flex;gap:8px;margin-top:8px">
       <button class="primary" onclick="saveEdit()">保存修改</button>
       <button onclick="cancelEdit()">取消</button>
     </div>`;
}

/* ---------- 基本文字 ---------- */
function renderBasic() {
  $("basicLangs").innerHTML = LANGS.map(l =>
    `<button class="langbtn ${l.code === basicLang ? "active" : ""}" onclick="setBasicLang('${l.code}')">${l.label}</button>`
  ).join("");
  const s = SITE, u = UI[basicLang] || {};
  const uiFields = Object.keys(UI["zh-CN"]).map(k =>
    `<label>${esc(k)}<input id="ui_${k}" value="${esc(u[k] || "")}"></label>`).join("");
  $("basicFields").innerHTML =
    `<label>网站名（左上角）<input id="s_siteName" value="${esc(s.siteName[basicLang] || "")}"></label>
     <label>首页介绍<input id="s_heroBio" value="${esc(s.heroBio[basicLang] || "")}"></label>
     <label>关于我<textarea id="s_about">${esc(s.about[basicLang] || "")}</textarea></label>
     <label>名字（首页大字）<input id="d_heroName" value="${esc(DATA.heroName)}"></label>
     <h3 style="margin:22px 0 12px;font-size:1rem">界面文字（当前语言）</h3>${uiFields}
     <button class="primary" onclick="saveBasic()">保存基本文字</button>`;
}

function setBasicLang(code) { readBasic(); basicLang = code; renderBasic(); }
function readBasic() {
  if (!$("s_siteName")) return;
  SITE.siteName[basicLang] = $("s_siteName").value;
  SITE.heroBio[basicLang] = $("s_heroBio").value;
  SITE.about[basicLang] = $("s_about").value;
  DATA.heroName = $("d_heroName").value;
  UI[basicLang] = UI[basicLang] || {};
  Object.keys(UI["zh-CN"]).forEach(k => {
    const el = $("ui_" + k);
    if (el) UI[basicLang][k] = el.value;
  });
}
function saveBasic() {
  readBasic();
  renderLists();
  status("已修改，记得点「保存到 GitHub」");
}

renderLists();
renderBasic();
</script>
</body>
</html>
