<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alan — Portfolio</title>
<meta name="description" content="Alan 的个人作品集：开源项目、自动化工厂、本地工具与文章。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="stylesheet" href="site.css" />
</head>
<body data-active="home">

<div class="progress" id="progress"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="transition" id="transition"></div>

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="wrap">

    <section class="page hero" id="home">
      <div class="hello" id="hello"></div>
      <h1><span id="heroName"></span></h1>
      <p class="hero-bio" id="heroBio"></p>
      <div class="socials" id="socials"></div>

      <div class="stats" id="stats">
        <div class="stat"><b data-count="0" id="countProjects">0</b><span id="statProjects"></span></div>
        <div class="stat"><b data-count="0" id="countLangs">0</b><span id="statLangs"></span></div>
        <div class="stat"><b data-count="0" id="countArticles">0</b><span id="statArticles"></span></div>
      </div>

      <div class="marquee" id="marquee">
        <div class="marquee-track" id="marqueeTrack"></div>
      </div>

      <div class="scroll-hint" id="scrollHint">
        <span id="scrollText"></span><span class="arrow">↓</span>
      </div>
    </section>

    <section class="page" id="projects">
      <h2 id="hProjects" class="reveal"></h2>
      <p class="section-note reveal" id="noteProjects"></p>
      <div class="grid" id="projectGrid"></div>
    </section>

    <section class="page" id="articles">
      <h2 id="hArticles" class="reveal"></h2>
      <p class="section-note reveal" id="noteArticles"></p>
      <div class="articles" id="articleList"></div>
    </section>

    <section class="page" id="about">
      <h2 id="hAbout" class="reveal"></h2>
      <p style="color:var(--muted);max-width:700px" class="reveal" id="aboutText"></p>
      <footer>© <span id="year"></span> <span id="footerName"></span> <span id="copyright"></span></footer>
    </section>

  </div>
</div>

<button class="to-top" id="toTop" title="Top">↑</button>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id);
$("footerName").textContent = DATA.heroName;
$("heroBio").textContent = S("heroBio");
$("aboutText").textContent = S("about");
$("year").textContent = new Date().getFullYear();
$("hello").textContent = T("hello");
$("scrollText").textContent = T("scrollHint");
$("statProjects").textContent = T("statProjects");
$("statLangs").textContent = T("statLangs");
$("statArticles").textContent = T("articles");
$("hProjects").textContent = T("sectionProjects");
$("noteProjects").textContent = T("projectsNote");
$("hArticles").textContent = T("sectionArticles");
$("noteArticles").textContent = T("articlesNote");
$("hAbout").textContent = T("sectionAbout");
$("copyright").textContent = T("copyright");

$("socials").innerHTML = DATA.socials.map(s =>
  `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("");

const marqueeText = `<span>${T("marquee")}</span><b>✦</b>`;
$("marqueeTrack").innerHTML = marqueeText + marqueeText + marqueeText + marqueeText;

$("projectGrid").innerHTML = DATA.projects.map((p, idx) => `
  <article class="card reveal" style="transition-delay:${Math.min(idx,9)*70}ms">
    <h3><a href="${L(p.detail)}">${C(p,"title")}</a></h3>
    <p>${C(p,"desc")}</p>
    <div class="tags">${C(p,"tags").map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="btn-row">
      <a class="btn btn-primary" href="${L(p.detail)}">${T("viewDetail")}</a>
      <a class="btn btn-ghost" href="${p.download}" target="_blank" rel="noopener">${T("download")}</a>
    </div>
  </article>`).join("");

$("articleList").innerHTML = DATA.articles.map((a, idx) => `
  <article class="article reveal" style="transition-delay:${idx*100}ms">
    <div class="date">${a.date}</div>
    <div>
      <h3><a href="${L(a.detail)}">${C(a,"title")}</a></h3>
      <div class="excerpt">${C(a,"excerpt")}</div>
    </div>
  </article>`).join("");

/* 数字跳动 */
function countUp(el) {
  const target = Number(el.dataset.count) || 0;
  let n = 0;
  const step = Math.max(1, Math.ceil(target / 16));
  const timer = setInterval(() => {
    n += step;
    if (n >= target) { n = target; clearInterval(timer); }
    el.textContent = n;
  }, 50);
}
$("countProjects").dataset.count = DATA.projects.length;
$("countLangs").dataset.count = LANGS.length;
$("countArticles").dataset.count = DATA.articles.length;

/* 逐字打出 */
const nameEl = $("heroName"), fullName = DATA.heroName;
nameEl.textContent = "";
const caret = document.createElement("span");
caret.className = "caret";
nameEl.appendChild(caret);
setTimeout(() => $("hello").classList.add("in"), 120);
setTimeout(function () {
  let i = 0;
  (function step() {
    if (i < fullName.length) {
      caret.insertAdjacentText("beforebegin", fullName[i]);
      i++;
      setTimeout(step, 230);
    } else {
      $("heroBio").classList.add("in");
      $("socials").classList.add("in");
      $("stats").classList.add("in");
      $("marquee").classList.add("in");
      $("scrollHint").classList.add("in");
      document.querySelectorAll(".stat b").forEach(countUp);
    }
  })();
}, 400);

/* 滚动淡入 */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* 顶部进度条 + 回到顶部 */
function onScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  $("progress").style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
  $("toTop").classList.toggle("show", scrollY > 400);
}
addEventListener("scroll", onScroll, { passive: true });
onScroll();
$("toTop").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

/* 每个页面加超大序号 */
document.querySelectorAll("main section.page").forEach((sec, i) => {
  const num = document.createElement("span");
  num.className = "page-num";
  num.textContent = String(i + 1).padStart(2, "0");
  sec.appendChild(num);
});

/* 鼠标跟随光晕（带平滑延迟） */
const glow = $("cursorGlow");
let mouseX = innerWidth / 2, mouseY = innerHeight / 2;
let glowX = mouseX, glowY = mouseY;
if (matchMedia("(hover:hover) and (pointer:fine)").matches) {
  addEventListener("pointermove", e => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
  (function follow() {
    glowX += (mouseX - glowX) * 0.12;
    glowY += (mouseY - glowY) * 0.12;
    glow.style.left = glowX + "px";
    glow.style.top = glowY + "px";
    requestAnimationFrame(follow);
  })();
}

/* 页面切换转场特效 */
const transition = $("transition");
const pageObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("active");
    // 触发擦除转场（重播动画）
    transition.classList.remove("play");
    void transition.offsetWidth;
    transition.classList.add("play");
  });
}, { threshold: 0.55 });
document.querySelectorAll("main section.page").forEach(s => pageObserver.observe(s));

/* 卡片 3D 倾斜 + 内部发光跟随鼠标 */
if (matchMedia("(hover:hover) and (pointer:fine)").matches) {
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("mousemove", e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const x = px - 0.5, y = py - 0.5;
      card.style.setProperty("--rx", (-y * 12).toFixed(2) + "deg");
      card.style.setProperty("--ry", (x * 16).toFixed(2) + "deg");
      card.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (py * 100).toFixed(1) + "%");
    });
    card.addEventListener("mouseleave", () => {
      card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--ry", "0deg");
    });
  });
}
</script>
</body>
</html>
