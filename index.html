<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Site</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0aa;
    --accent:#5b8cff; --accent2:#33d6a6; --border:#2a2e38;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  nav{position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);z-index:10}
  nav .wrap{display:flex;gap:18px;align-items:center;height:60px;flex-wrap:wrap}
  nav .logo{font-weight:700;margin-right:auto;color:var(--text)}
  nav a{color:var(--muted);font-size:14px}
  .langs{display:flex;gap:8px;flex-wrap:wrap}
  .langs a{font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:10px}
  .langs a.active{color:#fff;background:var(--accent);border-color:var(--accent)}

  header{padding:80px 0 60px;text-align:center;border-bottom:1px solid var(--border)}
  header h1{font-size:2.6rem;margin-bottom:10px}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);font-size:1.15rem;max-width:600px;margin:0 auto 22px}
  .socials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .socials a{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:14px}

  section{padding:60px 0}
  section h2{font-size:1.8rem;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  section h2::before{content:"";width:6px;height:26px;background:var(--accent);border-radius:3px}
  .section-note{color:var(--muted);font-size:14px;margin-bottom:28px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:20px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .card h3{font-size:1.2rem;margin-bottom:10px}
  .card h3 a{color:var(--text)}
  .card h3 a:hover{color:var(--accent)}
  .card p{color:var(--muted);font-size:14px;flex:1;margin-bottom:14px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tags span{font-size:12px;color:var(--accent2);background:rgba(51,214,166,.1);
    padding:2px 8px;border-radius:10px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{text-decoration:none;opacity:.9}
  .btn-ghost{border:1px solid var(--border);color:var(--text)}

  .articles{display:flex;flex-direction:column;gap:14px}
  .article{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
  .article .date{color:var(--muted);font-size:13px;white-space:nowrap;min-width:96px}
  .article h3{margin-bottom:4px;font-size:1.05rem}
  .article h3 a{color:var(--text)}
  .article h3 a:hover{color:var(--accent)}
  .article .excerpt{color:var(--muted);font-size:14px}

  footer{border-top:1px solid var(--border);padding:30px 0;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo" id="siteName"></div>
    <a href="index.html" id="navHome"></a>
    <a href="#projects" id="navProjects"></a>
    <a href="#articles" id="navArticles"></a>
    <a href="#about" id="navAbout"></a>
    <div class="langs" id="langs"></div>
  </div>
</nav>

<header>
  <div class="wrap">
    <h1><span id="hello"></span> <span id="heroName"></span></h1>
    <p id="heroBio"></p>
    <div class="socials" id="socials"></div>
  </div>
</header>

<main class="wrap">
  <section id="projects">
    <h2 id="hProjects"></h2>
    <p class="section-note" id="noteProjects"></p>
    <div class="grid" id="projectGrid"></div>
  </section>

  <section id="articles">
    <h2 id="hArticles"></h2>
    <p class="section-note" id="noteArticles"></p>
    <div class="articles" id="articleList"></div>
  </section>

  <section id="about">
    <h2 id="hAbout"></h2>
    <p style="color:var(--muted)" id="aboutText"></p>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="footerName"></span> <span id="copyright"></span></div>
</footer>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
$("siteName").textContent = S("siteName");
$("heroName").textContent = DATA.heroName;
$("footerName").textContent = DATA.heroName;
$("heroBio").textContent = S("heroBio");
$("aboutText").textContent = S("about");
$("year").textContent = new Date().getFullYear();

$("navHome").textContent = T("home");
$("navProjects").textContent = T("projects");
$("navArticles").textContent = T("articles");
$("navAbout").textContent = T("about");
$("hello").textContent = T("hello");
$("hProjects").textContent = T("sectionProjects");
$("noteProjects").textContent = T("projectsNote");
$("hArticles").textContent = T("sectionArticles");
$("noteArticles").textContent = T("articlesNote");
$("hAbout").textContent = T("sectionAbout");
$("copyright").textContent = T("copyright");
$("langs").innerHTML = langSwitcher();

$("socials").innerHTML = DATA.socials.map(s =>
  `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("");

$("projectGrid").innerHTML = DATA.projects.map(p => `
  <article class="card">
    <h3><a href="${L(p.detail)}">${C(p,"title")}</a></h3>
    <p>${C(p,"desc")}</p>
    <div class="tags">${C(p,"tags").map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="btn-row">
      <a class="btn btn-primary" href="${L(p.detail)}">${T("viewDetail")}</a>
      <a class="btn btn-ghost" href="${p.download}" target="_blank" rel="noopener">${T("download")}</a>
    </div>
  </article>`).join("");

$("articleList").innerHTML = DATA.articles.map(a => `
  <article class="article">
    <div class="date">${a.date}</div>
    <div>
      <h3><a href="${L(a.detail)}">${C(a,"title")}</a></h3>
      <div class="excerpt">${C(a,"excerpt")}</div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
