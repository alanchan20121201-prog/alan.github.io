<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Article</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0aa;
    --accent:#5b8cff; --border:#2a2e38;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.9;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  nav{border-bottom:1px solid var(--border)}
  nav .wrap{display:flex;gap:20px;align-items:center;height:60px;flex-wrap:wrap}
  nav .logo{font-weight:700;margin-right:auto}
  nav a{color:var(--muted);font-size:14px}
  .langs{display:flex;gap:8px;flex-wrap:wrap}
  .langs a{font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:10px}
  .langs a.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  main{padding:48px 0}
  .back{display:inline-block;margin-bottom:28px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:36px}
  .date{color:var(--muted);font-size:14px;margin-bottom:12px}
  h1{font-size:2rem;margin-bottom:28px;line-height:1.4}
  .content{font-size:16px;white-space:pre-wrap}
  footer{border-top:1px solid var(--border);padding:30px 0;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo" id="siteName"></div>
    <a href="index.html" id="backHome"></a>
    <div class="langs" id="langs"></div>
  </div>
</nav>

<main class="wrap">
  <a class="back" id="backArticles" href="index.html#articles"></a>
  <div class="card" id="card"></div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="footerName"></span> <span id="copyright"></span></div>
</footer>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
$("siteName").textContent = S("siteName");
$("footerName").textContent = DATA.heroName;
$("year").textContent = new Date().getFullYear();
$("backHome").textContent = T("backHome");
$("backArticles").textContent = T("backArticles");
$("copyright").textContent = T("copyright");
$("backArticles").href = L("index.html#articles");
$("langs").innerHTML = langSwitcher();

const i = parseInt(new URLSearchParams(location.search).get("i"), 10);
const a = DATA.articles[i];

if (!a) {
  $("card").innerHTML = `<h1>${T("notFoundArticle")}</h1>`;
} else {
  document.title = C(a,"title") + " - " + T("sectionArticles");
  $("card").innerHTML = `
    <div class="date">${a.date}</div>
    <h1>${C(a,"title")}</h1>
    <div class="content">${C(a,"content") || C(a,"excerpt")}</div>`;
}
</script>
</body>
</html>
