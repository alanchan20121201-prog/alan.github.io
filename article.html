<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Article</title>
<link rel="stylesheet" href="site.css" />
</head>
<body data-active="articles">

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="wrap detail-page">
    <a class="back" id="backArticles" href="index.html#articles"></a>
    <div class="card-detail" id="card"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id);
$("backArticles").textContent = T("backArticles");
$("backArticles").href = L("index.html#articles");

const i = parseInt(new URLSearchParams(location.search).get("i"), 10);
const a = DATA.articles[i];

if (!a) {
  $("card").innerHTML = `<h1>${T("notFoundArticle")}</h1>`;
} else {
  document.title = C(a,"title") + " - " + T("sectionArticles");
  $("card").innerHTML = `
    <div class="date">${a.date}</div>
    <h1>${C(a,"title")}</h1>
    <div class="detail-body">${C(a,"content") || C(a,"excerpt")}</div>`;
}
</script>
</body>
</html>
